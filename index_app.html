<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DMB — عطور فاخرة، نظارات وساعات</title>
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('dmb_lang'); } catch (e) { }
            var detected;
            if (saved === 'ar' || saved === 'fr') { detected = saved; }
            else {
                var sysLang = String(navigator.language || navigator.userLanguage || 'fr').toLowerCase();
                detected = /^(ar|ary|arz|ars|arb|apc|ajp)([-_]|$)/.test(sysLang) ? 'ar' : 'fr';
            }
            document.documentElement.lang = detected;
            document.documentElement.dir = detected === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('dmb_theme');
                var theme;
                if (saved === 'light' || saved === 'dark') theme = saved;
                else theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <meta name="description" content="اكتشف أفخم العطور، النظارات والساعات. تسوق الأناقة الخالدة.">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        :root {
            --safe-top: 0px;
            --safe-bottom: 0px;
            --bg: #ffffff;
            --bg-alt: #fafaf9;
            --bg-card: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-light: #999999;
            --border: #e8e8e6;
            --border-light: #f2f2f0;
            --accent: #c9a96e;
            --accent-dark: #a8874a;
            --accent-light: #f5efe4;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --nav-height: 56px;
            --bottom-nav-height: 60px;
            --banner-height: 0px;
            --max-width: 1280px;
            --success: #2d8a4e;
            --danger: #c0392b;
            --warning: #e67e22;
            --info: #2980b9;
        }
        @supports (padding: env(safe-area-inset-bottom)) {
            :root {
                --safe-top: env(safe-area-inset-top, 0px);
                --safe-bottom: env(safe-area-inset-bottom, 0px);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        button:focus, a:focus { outline: none; }
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom));
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d1cf; border-radius: 10px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3, h4, .font-display {
            font-family: var(--font-display);
            font-weight: 500;
            letter-spacing: -0.02em;
        }
        h1 { font-size: 2rem; line-height: 1.15; font-weight: 600; }
        h2 { font-size: 1.5rem; line-height: 1.2; font-weight: 500; }
        h3 { font-size: 1rem; line-height: 1.3; }

        /* ═══════════ TOP NAV ═══════════ */
        .top-nav {
            position: sticky;
            top: calc(var(--banner-height) + var(--safe-top));
            z-index: 100;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            height: var(--nav-height);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .nav-brand {
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }
        .nav-brand span { color: var(--accent); font-weight: 700; }

        .nav-links {
            display: flex;
            gap: 4px;
            margin-inline-start: auto;
            align-items: center;
        }
        .nav-links button {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 22px;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .nav-links button:active { background: var(--bg-alt); }

        /* ═══════════ BOTTOM NAV ═══════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            height: calc(var(--bottom-nav-height) + var(--safe-bottom));
            padding: 0 6px;
            padding-bottom: var(--safe-bottom);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .bottom-nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 0.62rem;
            font-weight: 500;
            padding: 5px 8px;
            border-radius: 10px;
            transition: var(--transition);
            font-family: var(--font-body);
            letter-spacing: 0.02em;
            min-width: 52px;
        }
        .bottom-nav button.active { color: var(--accent); }
        .bottom-nav button .icon { width: 22px; height: 22px; }
        .bottom-nav .cart-badge-mobile { position: relative; }
        .bottom-nav .cart-badge-mobile .badge-dot {
            position: absolute;
            top: -3px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            font-size: 0.58rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ═══════════ MAIN CONTENT ═══════════ */
        .main-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 14px;
            min-height: 60vh;
            animation: fadeIn 0.3s ease;
        }
        .page-section { display: none; }
        .page-section.active { display: block; }

        .section-header { text-align: center; margin: 26px 0 16px; }
        .section-header h2 { margin-bottom: 4px; }
        .section-header p { color: var(--text-secondary); font-size: 0.85rem; max-width: 480px; margin: 0 auto; }

        /* ═══════════ STORE HOME ═══════════ */
        .store-hero {
            position: relative;
            margin: 12px 0 16px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 16/10;
            max-height: 240px;
            box-shadow: var(--shadow);
        }
        .store-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .store-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.78) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            color: #fff;
        }
        .store-hero-overlay h2 {
            font-size: 1.35rem;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .store-hero-overlay p {
            font-size: 0.82rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        .store-categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin: 0 -14px;
            padding-inline: 14px;
        }
        .store-categories::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .cat-chip.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .store-feed {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 4px 0 24px;
        }
        #homeLoader {
            text-align: center;
            padding: 24px;
        }
        .home-loader-spinner {
            width: 26px;
            height: 26px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        /* ═══════════ PRODUCT GRID & CARDS ═══════════ */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .product-card:active { transform: scale(0.985); }
        .product-card .img-wrap {
            aspect-ratio: 1/1;
            background: #fafaf8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .product-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .product-card .img-wrap .wishlist-icon {
            position: absolute;
            top: 8px;
            inset-inline-end: 8px;
            background: var(--bg);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
            z-index: 2;
            box-shadow: var(--shadow-sm);
            color: #999;
        }
        .product-card .img-wrap .wishlist-icon.liked { color: #e74c3c; border-color: #fce4e4; background: #fff5f5; }
        .product-card .img-wrap .badge {
            position: absolute;
            top: 8px;
            inset-inline-start: 8px;
            background: var(--text);
            color: var(--bg);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .product-card .img-wrap .badge.new { background: var(--accent); color: #fff; }
        .product-card .info { padding: 10px 11px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .product-card .info .name { font-weight: 600; font-size: 0.82rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card .info .category-label { font-size: 0.62rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        .product-card .info .price-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
        .product-card .info .price { font-weight: 700; font-size: 0.95rem; color: var(--text); }
        .product-card .info .discount-price { font-size: 0.72rem; color: var(--text-light); text-decoration: line-through; }
        .product-card .info .stock { font-size: 0.66rem; margin-top: 2px; }
        .stock-in { color: var(--success); }
        .stock-low { color: var(--warning); }
        .stock-out { color: var(--danger); }
        .product-card .info .add-cart-btn { margin-top: 6px; width: 100%; }

        /* ═══════════ CATEGORIES PAGE ═══════════ */
        .categories-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 12px 0 24px;
        }
        .category-card {
            aspect-ratio: 1/1;
            border-radius: var(--radius-lg);
            background: var(--bg-alt);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-light);
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 500;
            gap: 8px;
            text-align: center;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }
        .category-card:active { transform: scale(0.97); }
        .category-card .cat-icon { width: 40px; height: 40px; color: var(--accent); }

        /* ═══════════ SEARCH PAGE ═══════════ */
        .search-page-header {
            position: sticky;
            top: calc(var(--banner-height) + var(--safe-top) + var(--nav-height));
            background: var(--bg);
            padding: 12px 0;
            z-index: 5;
            margin: 0 -14px;
            padding-inline: 14px;
            border-bottom: 1px solid var(--border-light);
        }
        .search-page-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-alt);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 8px 14px;
            transition: var(--transition);
        }
        .search-page-input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
            background: var(--bg);
        }
        .search-page-icon { width: 18px; height: 18px; color: var(--text-light); flex-shrink: 0; }
        .search-page-input-wrap input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.92rem;
            color: var(--text);
        }
        .search-page-input-wrap input::placeholder { color: var(--text-light); }
        .search-page-clear {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 2px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .search-page-clear i { width: 16px; height: 16px; }
        .search-page-results {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .search-result-item:active { background: var(--bg-alt); }
        .search-result-item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            background: #fafaf8;
        }
        .search-result-info { flex: 1; min-width: 0; }
        .search-result-name { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-meta { font-size: 0.72rem; color: var(--text-light); display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
        .search-result-price { font-weight: 700; font-size: 0.85rem; white-space: nowrap; color: var(--text); }
        .search-empty { text-align: center; padding: 40px 16px; color: var(--text-light); font-size: 0.85rem; }

        /* ═══════════ BUTTONS ═══════════ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 22px;
            border-radius: 24px;
            font-family: var(--font-body);
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            letter-spacing: 0.02em;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:active { background: var(--bg-alt); }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:active { transform: scale(0.97); }
        .btn-sm { padding: 7px 14px; font-size: 0.76rem; border-radius: 16px; }
        .btn-xs { padding: 4px 10px; font-size: 0.7rem; border-radius: 12px; }
        .btn-danger { background: var(--bg); border: 1.5px solid #e74c3c; color: #e74c3c; }
        .btn-success { background: var(--success); color: #fff; }

        /* ═══════════ BRANCHES (used in About) ═══════════ */
        .branches-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 12px;
            margin: 12px 0;
        }
        .branch-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 14px;
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .branch-card .branch-icon { color: var(--accent); margin-bottom: 6px; }
        .branch-card h4 { font-weight: 600; margin-bottom: 2px; font-family: var(--font-body); font-size: 0.85rem; }
        .branch-card p { font-size: 0.72rem; color: var(--text-secondary); line-height: 1.4; }

        /* ═══════════ CART DRAWER ═══════════ */
        .cart-overlay {
            position: fixed;
            top: calc(var(--banner-height) + var(--safe-top));
            left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .cart-overlay.open { display: block; opacity: 1; }
        .cart-drawer {
            position: fixed;
            top: calc(var(--banner-height) + var(--safe-top));
            right: 0; bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .cart-drawer.open { transform: translateX(0); }
        .cart-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 1.05rem;
        }
        .cart-drawer-header button { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px 8px; border-radius: 50%; }
        .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius-sm); background: var(--bg-alt); }
        .cart-item .ci-img { width: 56px; height: 56px; border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0; }
        .cart-item .ci-img img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item .ci-info { flex: 1; min-width: 0; }
        .cart-item .ci-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item .ci-price { font-size: 0.8rem; color: var(--text-secondary); }
        .cart-item .ci-qty { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .cart-item .ci-qty button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .cart-item .ci-qty span { font-weight: 600; min-width: 18px; text-align: center; font-size: 0.85rem; }
        .cart-item .ci-remove { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px; }
        .cart-empty { text-align: center; padding: 40px 18px; color: var(--text-light); font-size: 0.9rem; }
        .cart-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: calc(20px + var(--safe-bottom));
            flex-shrink: 0;
        }
        .cart-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; }

        /* ═══════════ CHECKOUT ═══════════ */
        .checkout-form { display: flex; flex-direction: column; gap: 12px; padding-bottom: 30px; }
        .checkout-form label { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-secondary); }
        .checkout-form input, .checkout-form select, .checkout-form textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--transition);
            background: var(--bg);
            color: var(--text);
        }
        .checkout-form input:focus, .checkout-form select:focus, .checkout-form textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .checkout-form textarea { min-height: 70px; resize: vertical; }
        .checkout-form .field-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .checkout-form .field-group > div { flex: 1; min-width: 120px; }
        .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .radio-option {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            font-weight: 500;
            background: var(--bg);
            font-size: 0.82rem;
        }
        .radio-option.selected { border-color: var(--accent); background: var(--accent-light); font-weight: 600; }
        .radio-option input { display: none; }
        .address-section { transition: all 0.3s ease; overflow: hidden; }
        .address-section.disabled { opacity: 0.4; pointer-events: none; max-height: 0; margin: 0; padding: 0; border: none; }

        /* ═══════════ TOASTS ═══════════ */
        .toast-container {
            position: fixed;
            bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
            right: 14px;
            left: 14px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            pointer-events: none;
        }
        .toast {
            padding: 11px 18px;
            border-radius: 24px;
            background: #1a1a1a;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 500;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
            box-shadow: var(--shadow-lg);
            max-width: 90%;
            text-align: center;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-8px); }
        }

        /* ═══════════ AD TAPE ═══════════ */
        .ad-tape {
            position: sticky;
            top: 0;
            z-index: 101;
            height: calc(var(--banner-height) + var(--safe-top));
            padding-top: var(--safe-top);
            background: var(--text);
            color: var(--bg);
            overflow: hidden;
            display: none;
            align-items: center;
            font-family: var(--font-body);
            font-size: 0.74rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            user-select: none;
        }
        .ad-tape.visible { display: flex; }
        .ad-tape-track { display: flex; flex-direction: row; white-space: nowrap; will-change: transform; }
        .ad-tape-track > span { flex-shrink: 0; padding: 0 2em; }
        html[dir="ltr"] .ad-tape-track { animation: ad-tape-scroll-ltr 40s linear infinite; }
        html[dir="rtl"] .ad-tape-track { animation: ad-tape-scroll-rtl 40s linear infinite; }
        @keyframes ad-tape-scroll-ltr {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        @keyframes ad-tape-scroll-rtl {
            from { transform: translateX(0); }
            to   { transform: translateX(50%); }
        }

        /* ═══════════ ADMIN ═══════════ */
        .admin-table-wrap { overflow-x: auto; margin: 12px 0; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; min-width: 500px; }
        .admin-table th, .admin-table td { padding: 6px 8px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .admin-table th { font-weight: 600; background: var(--bg-alt); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-secondary); }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
        .status-pending { background: #fef9e7; color: #b7950b; }
        .status-confirmed { background: #e8f4fd; color: #21618c; }
        .status-ready { background: #eaf7ee; color: #1e7e34; }
        .status-outdelivery { background: #fef3e2; color: #c05600; }
        .status-delivered { background: #eaf7ee; color: #145a32; }
        .status-cancelled { background: #fdedec; color: #922b21; }

        /* ═══════════ SOCIAL LINKS (in About) ═══════════ */
        .social-links { display: flex; gap: 16px; align-items: center; justify-content: center; }
        .social-links ion-icon { font-size: 28px; color: var(--text-light); cursor: pointer; transition: var(--transition); }
        .social-links ion-icon:active { color: var(--text); }

        /* ═══════════ ICON HELPERS ═══════════ */
        .icon-inline { width: 18px; height: 18px; vertical-align: middle; }
        .icon-lg { width: 26px; height: 26px; }
        .text-center { text-align: center; }
        .mt-20 { margin-top: 20px; }
        .gap-10 { gap: 10px; }
        .flex-wrap { display: flex; flex-wrap: wrap; }

        /* ═══════════ TYPES / BOTTLES ═══════════ */
        .types-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; }
        .type-box {
            padding: 10px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg);
            font-size: 0.78rem;
            font-weight: 500;
        }
        .type-box.selected { background: var(--accent-light); border-color: var(--accent); font-weight: 700; }

        .bottle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .bottle-card {
            position: relative;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }
        .bottle-card.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 3px var(--accent-light); }
        .bottle-card.out-of-stock { opacity: 0.45; pointer-events: none; }
        .bottle-card-img { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: #fafaf8; }
        .bottle-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .bottle-card-info { padding: 2px 4px 4px; }
        .bottle-card-name { font-size: 0.75rem; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .bottle-card-price { font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
        .bottle-card-check {
            position: absolute;
            top: 6px;
            inset-inline-end: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--border);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .bottle-card-check svg { width: 14px; height: 14px; }
        .bottle-card.selected .bottle-card-check { background: var(--accent); color: #fff; }

        /* ═══════════ SEARCH BAR (category page) ═══════════ */
        .search-bar-wrap { display: flex; gap: 8px; margin: 12px 0 14px; flex-wrap: wrap; }
        .search-bar-wrap input {
            flex: 1;
            min-width: 140px;
            padding: 9px 14px;
            border: 1.5px solid var(--border);
            border-radius: 22px;
            font-family: var(--font-body);
            font-size: 0.86rem;
            transition: var(--transition);
            background: var(--bg);
            color: var(--text);
        }
        .search-bar-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .search-bar-wrap select {
            padding: 9px 12px;
            border-radius: 22px;
            border: 1.5px solid var(--border);
            font-family: var(--font-body);
            font-size: 0.8rem;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
        }

        /* ═══════════ SETTINGS / NAVIGATION DRAWER ═══════════ */
        .settings-overlay {
            position: fixed;
            top: calc(var(--banner-height) + var(--safe-top));
            left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .settings-overlay.open { display: block; opacity: 1; }

        .settings-drawer.nav-drawer {
            position: fixed;
            top: calc(var(--banner-height) + var(--safe-top));
            left: 0; right: 0; bottom: 0;
            height: calc(100vh - var(--banner-height) - var(--safe-top));
            height: calc(100dvh - var(--banner-height) - var(--safe-top));
            background: var(--bg);
            color: var(--text);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .settings-drawer.nav-drawer.open { transform: translateX(0); }

        .nav-drawer-header { position: relative; flex-shrink: 0; }
        .nav-drawer-banner {
            height: 140px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        }
        .nav-drawer-banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .nav-drawer-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.10) 55%, rgba(0, 0, 0, 0.45) 100%);
            pointer-events: none;
        }
        .nav-drawer-close-btn {
            position: absolute;
            top: 12px;
            inset-inline-end: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .nav-drawer-close-btn i { width: 18px; height: 18px; }

        .nav-drawer-profile {
            padding: 0 18px;
            display: flex;
            align-items: flex-end;
            gap: 14px;
            margin-top: -36px;
            position: relative;
            z-index: 1;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .nav-drawer-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--bg);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
            flex-shrink: 0;
            background: var(--accent);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-drawer-avatar-fallback { color: #fff; font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; user-select: none; }
        .nav-drawer-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .nav-drawer-user {
            min-width: 0;
            flex: 1;
            padding-bottom: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nav-drawer-username {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            line-height: 1.25;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-drawer-verified {
            width: 16px;
            height: 16px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .nav-drawer-email {
            font-size: 0.74rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.01em;
        }

        .nav-drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px calc(20px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
        }
        .nav-drawer-section { padding: 10px 4px; }
        .nav-drawer-section + .nav-drawer-section { border-top: 1px solid var(--border-light); }
        .nav-drawer-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 6px 10px;
        }
        .nav-drawer-section-title .icon-inline { width: 14px; height: 14px; }
        .nav-drawer-links { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
        .nav-drawer-version { text-align: center; font-size: 0.7rem; color: var(--text-light); padding: 18px 8px 8px; margin-top: auto; }

        .settings-option-group { display: flex; gap: 4px; background: var(--bg-alt); padding: 4px; border-radius: 12px; }
        .settings-option {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .settings-option.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow-sm); }
        .settings-option .icon-inline { width: 15px; height: 15px; }

        .settings-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: start;
            width: 100%;
        }
        .settings-link:active { background: var(--bg-alt); }
        .settings-link .icon-inline { width: 18px; height: 18px; color: var(--text-secondary); }
        .settings-chevron { margin-inline-start: auto; color: var(--text-light); width: 16px; height: 16px; }

        /* ═══════════ LOADING OVERLAY ═══════════ */
        .loading-hidden { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }

        /* ═══════════ DARK MODE ═══════════ */
        html[data-theme="dark"] {
            --bg: #0d0d0d;
            --bg-alt: #171717;
            --bg-card: #1a1a1a;
            --text: #ececec;
            --text-secondary: #a0a0a0;
            --text-light: #6e6e6e;
            --border: #2a2a2a;
            --border-light: #222;
            --accent: #c9a96e;
            --accent-dark: #b89456;
            --accent-light: #2a2418;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
            --success: #4ade80;
            --danger: #f87171;
            --warning: #fbbf24;
            --info: #60a5fa;
        }
        html[data-theme="dark"] .top-nav { background: rgba(13, 13, 13, 0.94); }
        html[data-theme="dark"] .bottom-nav { background: rgba(13, 13, 13, 0.96); }
        html[data-theme="dark"] .product-card .img-wrap { background: #1f1f1f; }
        html[data-theme="dark"] .product-card .img-wrap .wishlist-icon { background: var(--bg-card); border-color: var(--border); }
        html[data-theme="dark"] .cart-item .ci-qty button,
        html[data-theme="dark"] .checkout-form input,
        html[data-theme="dark"] .checkout-form select,
        html[data-theme="dark"] .checkout-form textarea,
        html[data-theme="dark"] .radio-option,
        html[data-theme="dark"] .type-box,
        html[data-theme="dark"] .search-bar-wrap input,
        html[data-theme="dark"] .search-bar-wrap select { background: var(--bg-alt); color: var(--text); border-color: var(--border); }
        html[data-theme="dark"] .search-result-item img { background: var(--bg-alt); }
        html[data-theme="dark"] #loadingOverlay { background: rgba(0, 0, 0, 0.6) !important; }
        html[data-theme="dark"] #loadingOverlay > div { background: var(--bg-card) !important; }
        html[data-theme="dark"] .product-detail-gallery > div:first-child { background: #1f1f1f !important; }
        html[data-theme="dark"] .btn-primary { background: #f0f0f0; color: #0d0d0d; }
        html[data-theme="dark"] .btn-outline { border-color: var(--border); color: var(--text); }
        html[data-theme="dark"] .toast { background: #2a2a2a; color: var(--text); }
        html[data-theme="dark"] .ad-tape { background: #1a1a1a; color: var(--text); }
        html[data-theme="dark"] .product-card .img-wrap .badge { background: #2a2a2a; color: var(--text); }
        html[data-theme="dark"] .product-card .img-wrap .badge.new { background: var(--accent); color: #fff; }
        html[data-theme="dark"] .bottle-card-img { background: #1f1f1f; }
        html[data-theme="dark"] .search-page-input-wrap { background: var(--bg-alt); border-color: var(--border); }
                /* Selected states must beat the dark-mode base override
           (html[data-theme="dark"] .type-box is 0,2,1 — .type-box.selected is 0,2,0).
           These three rules bump specificity to 0,3,1 and re-apply the accent styling. */
        html[data-theme="dark"] .type-box.selected,
        html[data-theme="dark"] .type-chip.selected,
        html[data-theme="dark"] .radio-option.selected {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.18);
        }
    </style>
</head>

<body>
    <div id="loadingOverlay"
        style="position:fixed;inset:0;background:rgba(255,255,255,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:var(--radius);padding:40px 48px;box-shadow:var(--shadow-lg);text-align:center;">
            <div style="width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin:0;" data-translate="loading">جار تحميل المجموعات الفاخرة...</p>
        </div>
    </div>

    <div class="ad-tape" id="adTape" aria-live="off">
        <div class="ad-tape-track" id="adTapeTrack"></div>
    </div>

    <nav class="top-nav" id="topNav">
        <div class="nav-brand" onclick="navigate('home')"><span>.</span>DMB</div>
        <div class="nav-links">
            <button class="nav-settings-btn" onclick="toggleSettingsDrawer()" aria-label="Menu">
                <i data-lucide="text-align-justify"></i>
            </button>
        </div>
    </nav>

    <div class="main-content" id="mainContent">

        <!-- ═══════════ HOME ═══════════ -->
        <div class="page-section" id="page-home">
            <!-- <div class="store-hero">
                <img src="boutique-dmb-2.jpg" alt="Boutique DMB">
                <div class="store-hero-overlay">
                    <h2 data-translate="heroTitle2">المميز</h2>
                    <p data-translate="heroDescription">عطور فاخرة، نظارات مصممة، وساعات راقية.</p>
                </div>
            </div> -->
            <div class="store-categories" id="storeCategories"></div>
            <div class="store-feed" id="homeFeed"></div>
            <div id="homeLoader"></div>
        </div>

        <!-- ═══════════ CATEGORIES PAGE ═══════════ -->
        <div class="page-section" id="page-categories"></div>

        <!-- ═══════════ SEARCH PAGE ═══════════ -->
        <div class="page-section" id="page-search"></div>

        <!-- ═══════════ OTHER PAGES ═══════════ -->
        <div class="page-section" id="page-wishlist"></div>
        <div class="page-section" id="page-checkout"></div>
        <div class="page-section" id="page-product-detail"></div>
        <div class="page-section" id="page-confirmation"></div>
        <div class="page-section" id="page-admin"></div>
        <div class="page-section" id="page-about"></div>
        <div class="page-section" id="page-privacy"></div>

        <!-- Dynamic category pages appended here by buildDynamicUI -->
    </div>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <span><i data-lucide="shopping-cart" class="icon-inline"></i> <span data-translate="cart">السلة</span> <span id="cartItemCount">(0)</span></span>
            <button onclick="toggleCart()"><i data-lucide="x"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total"><span data-translate="total">المجموع:</span><span id="cartTotal">0.00 DA</span></div>
            <button class="btn btn-primary" style="width:100%;" onclick="toggleCart();navigate('checkout')">
                <i data-lucide="arrow-right" class="icon-inline"></i> <span data-translate="checkout">إتمام الشراء</span>
            </button>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettingsDrawer()"></div>
    <div class="settings-drawer nav-drawer" id="settingsDrawer">
        <div class="nav-drawer-header">

        function detectLanguage() {
            try {
                const saved = localStorage.getItem('dmb_lang');
                if (saved === 'ar' || saved === 'fr') return saved;
            } catch (e) { }
            const sysLang = String(navigator.language || navigator.userLanguage || 'fr').toLowerCase();
            return /^(ar|ary|arz|ars|arb|apc|ajp)([-_]|$)/.test(sysLang) ? 'ar' : 'fr';
        }

        function syncLanguageUI() {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }

        let lang = detectLanguage();
        function t(key) {
            if (translations[lang][key]) return translations[lang][key];
            const keyStr = String(key).trim();
            if (translations[lang][keyStr]) return translations[lang][keyStr];
            const keyLower = keyStr.toLowerCase();
            for (const k in translations[lang]) {
                if (String(k).toLowerCase() === keyLower) return translations[lang][k];
            }
            return keyStr;
        }

        function setLanguage(newLang) {
            if (newLang === lang) return;
            lang = newLang;
            try { localStorage.setItem('dmb_lang', lang); } catch (e) { }
            syncLanguageUI();
            applyTranslations();
            renderAdTape();
            renderPage(STATE.currentPage);
            updateCartBadge();
            updateSettingsActiveStates();
            lucide.createIcons();
        }

        function applyTranslations() {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                el.textContent = t(key);
            });
        }

        // ═══════════ DATA FETCHING ═══════════
        async function fetchSheetData(spreadsheetId, sheetName) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}?key=${API_KEY}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch ${sheetName}`);
            const data = await response.json();
            const rows = data.values;
            if (!rows || rows.length === 0) return [];
            const headers = rows[0];
            return rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((header, i) => {
                    const val = row[i] || '';
                    if (!isNaN(val) && val !== '') obj[header] = Number(val);
                    else obj[header] = val;
                });
                return obj;
            });
        }

        async function loadData() {
            try {
                products = await fetchSheetData(PRODUCTS_SHEET_ID, PRODUCTS_SHEET_NAME);
                categories = await fetchSheetData(CATEGORIES_SHEET_ID, CATEGORIES_SHEET_NAME);
                branches = await fetchSheetData(BRANCHES_SHEET_ID, BRANCHES_SHEET_NAME);
                volumePrices = await fetchSheetData(VOLUME_PRICES_SHEET_ID, VOLUME_PRICES_SHEET_NAME);
                types = await fetchSheetData(TYPES_SHEET_ID, TYPES_SHEET_NAME);
                try {
                    banners = await fetchSheetData(BANNER_SHEET_ID, BANNER_SHEET_NAME);
                } catch (e) { banners = []; }

                categories = categories.map(c => ({
                    ...c,
                    slug: String(c.slug || '').trim(),
                    name: String(c.name || '').trim()
                }));
                products = products.map(p => ({
                    ...p,
                    category: String(p.category || '').trim()
                }));

                const overlay = document.getElementById('loadingOverlay');
                overlay.classList.add('loading-hidden');
                overlay.addEventListener('transitionend', () => overlay.remove(), {once: true});

                syncLanguageUI();
                buildDynamicUI();
                renderAdTape();
                applyTranslations();

                const initialHash = decodeURIComponent(window.location.hash.replace('#', ''));
                if (initialHash) {
                    const [page, query] = initialHash.split('?');
                    const params = new URLSearchParams(query || '');
                    navigate(page, params.get('id') ? parseInt(params.get('id')) : null);
                } else {
                    navigate('home');
                }
            } catch (error) {
                console.error('Failed to load sheet data:', error);
                alert('Could not load store data. Please check your API key and sheet setup.');
                products = []; categories = []; branches = []; volumePrices = []; types = []; banners = [];
                renderAdTape();
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    overlay.classList.add('loading-hidden');
                    overlay.addEventListener('transitionend', () => overlay.remove(), {once: true});
                }
                navigate('home');
            }
        }

        // ═══════════ AD TAPE ═══════════
        function renderAdTape() {
            const tape = document.getElementById('adTape');
            const track = document.getElementById('adTapeTrack');
            if (!tape || !track) return;
            const key = lang === 'ar' ? 'ar' : 'fr';
            const msgs = (banners || []).map(b => String(b[key] || '').trim()).filter(Boolean);
            if (msgs.length === 0) {
                tape.classList.remove('visible');
                document.documentElement.style.setProperty('--banner-height', '0px');
                track.innerHTML = '';
                return;
            }
            document.documentElement.style.setProperty('--banner-height', '34px');
            tape.classList.add('visible');
            const joined = msgs.join('  •  ') + '  •  ';
            let content = joined;
            while (content.length < 500) content += joined;
            track.innerHTML = '';
            for (let i = 0; i < 2; i++) {
                const span = document.createElement('span');
                span.textContent = content;
                track.appendChild(span);
            }
            track.style.animation = 'none';
            void track.offsetWidth;
            track.style.animation = '';
        }

        // ═══════════ NAVIGATION ═══════════
        function navigate(page, productId = null) {
            if (page === 'product-detail' && STATE.currentPage !== 'product-detail') {
                STATE.previousPage = STATE.currentPage || 'home';
            }
            STATE.currentPage = page;
            navigatingManually = true;
            window.location.hash = encodeURIComponent(page) + (productId ? '?id=' + productId : '');

            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('page-' + page);
            if (target) target.classList.add('active');

            document.querySelectorAll('.bottom-nav button[data-page]').forEach(b => b.classList.remove('active'));
            const bb = document.querySelector(`.bottom-nav button[data-page="${page}"]`);
            if (bb) bb.classList.add('active');

            window.scrollTo({top: 0, behavior: 'smooth'});
            renderPage(page, productId);
            updateCartBadge();
            lucide.createIcons();
        }

        function renderPage(page, productId = null) {
            switch (page) {
                case 'home': renderHome(); break;
                case 'categories': renderCategoriesPage(); break;
                case 'search': renderSearchPage(); break;
                case 'wishlist': renderWishlist(); break;
                case 'checkout': renderCheckout(); break;
                case 'confirmation': renderConfirmation(); break;
                case 'admin': renderAdmin(); break;
                case 'about': renderAbout(); break;
                case 'privacy': renderPrivacy(); break;
                case 'product-detail': if (productId) renderProductDetail(parseInt(productId)); break;
                default:
                    if (categories.some(c => c.slug === page)) renderCategoryPage(page);
                    else renderHome();
            }
        }

        // ═══════════ HELPERS ═══════════
        function isTrue(value) {
            if (typeof value === 'boolean') return value;
            if (typeof value === 'number') return value === 1;
            if (typeof value === 'string') return value.toLowerCase() === 'true';
            return false;
        }

        function getProductImage(productOrUrl, variant = 0) {
            if (typeof productOrUrl === 'object') {
                const p = productOrUrl;
                if (variant === 0) return p.image1 || `https://picsum.photos/seed/${p.id}/400/400`;
                if (variant === 1) return p.image2 || p.image1 || `https://picsum.photos/seed/${p.id}v1/400/400`;
                if (variant === 2) return p.image3 || p.image1 || `https://picsum.photos/seed/${p.id}v2/400/400`;
                return p.image1 || `https://picsum.photos/seed/${p.id}/400/400`;
            }
            const product = products.find(pr => pr.id == productOrUrl);
            if (product) return getProductImage(product, variant);
            return `https://picsum.photos/seed/${productOrUrl}/400/400`;
        }

        function getUniqueProducts(productList) {
            const unique = [];
            const seen = new Set();
            for (const p of productList) {
                if (!seen.has(p.id)) { seen.add(p.id); unique.push(p); }
            }
            return unique;
        }

        function getEffectivePrice(p) {
            const catNorm = String(p.category).trim().toLowerCase();
            if (catNorm === 'extraits') {
                const productTypes = types.filter(t => t.perfumeId == p.id);
                const minMultiplier = productTypes.length ? Math.min(...productTypes.map(t => Number(t.multiplier))) : 1;
                return Math.min(...volumePrices.map(vp => vp.price * minMultiplier));
            }
            if (catNorm === 'parfums de division' || catNorm === 'testeurs' || catNorm === 'dupes' || catNorm === 'parfums') {
                const productTypes = types.filter(t => t.perfumeId == p.id);
                const minMultiplier = productTypes.length ? Math.min(...productTypes.map(t => Number(t.multiplier))) : 1;
                return Number(p.price) * minMultiplier;
            }
            if (catNorm === 'collections') return Number(p.collectionPrice) || 0;
            return Number(p.discountPrice) || Number(p.price);
        }

        function normalizeForSearch(str) {
            return String(str || '')
                .toLowerCase()
                .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
                .replace(/[إأآٱا]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function isArabicText(str) {
            return /[\u0600-\u06FF]/.test(String(str || ''));
        }

        function getDisplayName(p) {
            if (!p) return '';
            if (lang === 'ar') {
                const ar = String(p.nameAR || '').trim();
                if (ar) return ar;
            }
            return String(p.name || '').trim();
        }

        function getDisplayNameFor(p, useArabic) {
            if (!p) return '';
            if (useArabic) {
                const ar = String(p.nameAR || '').trim();
                if (ar) return ar;
            }
            return String(p.name || '').trim();
        }

        function levenshtein(a, b) {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            let prev = new Array(b.length + 1);
            let curr = new Array(b.length + 1);
            for (let j = 0; j <= b.length; j++) prev[j] = j;
            for (let i = 1; i <= a.length; i++) {
                curr[0] = i;
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
                }
                [prev, curr] = [curr, prev];
            }
            return prev[b.length];
        }

        function fuzzyScore(text, query) {
            if (!text || !query) return 0;
            text = normalizeForSearch(text);
            query = normalizeForSearch(query);
            if (!text || !query) return 0;
            if (query.length < 2) return text.includes(query) ? 500 : 0;
            const idx = text.indexOf(query);
            if (idx !== -1) return idx === 0 ? 10000 : 5000 - idx;
            let qi = 0;
            for (let i = 0; i < text.length && qi < query.length; i++) {
                if (text[i] === query[qi]) qi++;
            }
            const subseqOk = qi === query.length;
            const words = text.split(/[\s\-_.,()/]+/).filter(Boolean);
            let bestWord = 0;
            for (const w of words) {
                const dist = levenshtein(w, query);
                const minLen = Math.min(w.length, query.length);
                if (!minLen) continue;
                const ratio = dist / minLen;
                let s = 0;
                if (ratio <= 0.2) s = 800;
                else if (ratio <= 0.35) s = 400;
                else if (ratio <= 0.5) s = 120;
                if (s > bestWord) bestWord = s;
            }
            if (bestWord > 0) return bestWord;
            return subseqOk ? 50 : 0;
        }

        const homeState = {

        function renderHome() {
            const active = products.filter(p => String(p.status).toLowerCase() === 'active');
            active.sort((a, b) => {
                const aFeat = isTrue(a.featured) ? 1 : 0;
                const bFeat = isTrue(b.featured) ? 1 : 0;

                const aBest = isTrue(a.bestseller) ? 1 : 0;
                const bBest = isTrue(b.bestseller) ? 1 : 0;
                if (aBest !== bBest) return bBest - aBest;

            homeState.allProducts = getUniqueProducts(active);
            homeState.loaded = 0;

            const feed = document.getElementById('homeFeed');
            if (feed) feed.innerHTML = '';
            renderHomeCategories();
            loadMoreHomeProducts();
        }

        function loadMoreHomeProducts() {
            if (homeState.loading) return;
            const feed = document.getElementById('homeFeed');
            if (!feed) return;
            homeState.loading = true;

            let list = homeState.allProducts;
            if (homeState.activeFilter) {
                const target = String(homeState.activeFilter).toLowerCase();
                list = list.filter(p => String(p.category).toLowerCase() === target);
            }

            const next = list.slice(homeState.loaded, homeState.loaded + homeState.pageSize);
            homeState.loaded += next.length;

            if (next.length > 0) {
                feed.insertAdjacentHTML('beforeend', next.map(productCardHTML).join(''));
                lucide.createIcons();
            }

            homeState.loading = false;

            const loader = document.getElementById('homeLoader');
            if (loader) {
                if (homeState.loaded >= list.length) {
                    loader.innerHTML = `<p style="font-size:0.78rem;color:var(--text-light);">${t('endOfList')}</p>`;
                } else {
                    loader.innerHTML = `<div class="home-loader-spinner"></div>`;
                }
            }
        }

        function handleHomeScroll() {
            if (STATE.currentPage !== 'home') return;
            const scrollPos = window.innerHeight + window.scrollY;
            const threshold = document.documentElement.scrollHeight - 400;
            if (scrollPos >= threshold) {
                loadMoreHomeProducts();
            }
        }

        function filterProducts(category) {
            const rawSearch = document.getElementById('searchInput-' + category)?.value || '';
            const normalizedSearch = normalizeForSearch(rawSearch);
            const sortVal = document.getElementById('sortSelect-' + category)?.value || 'default';
            const catNorm = String(category).trim().toLowerCase();

            let filtered = products.filter(p =>
                String(p.category).trim().toLowerCase() === catNorm && String(p.status).toLowerCase() === 'active'
            );

            if (normalizedSearch) {
                const typeMatchIds = new Set();
                for (const ty of types) {
                    if (normalizeForSearch(ty.TypeName).includes(normalizedSearch)) {
                        typeMatchIds.add(String(ty.perfumeId));
                    }
                }
                filtered = filtered.filter(p =>
                    normalizeForSearch(p.name).includes(normalizedSearch) ||
                    normalizeForSearch(p.nameAR).includes(normalizedSearch) ||
                    normalizeForSearch(p.description).includes(normalizedSearch) ||
                    typeMatchIds.has(String(p.id))
                );
            }

            if (sortVal === 'price-asc') filtered.sort((a, b) => getEffectivePrice(a) - getEffectivePrice(b));
            if (sortVal === 'price-desc') filtered.sort((a, b) => getEffectivePrice(b) - getEffectivePrice(a));
            if (sortVal === 'name-asc') filtered.sort((a, b) => getDisplayName(a).localeCompare(getDisplayName(b)));

            const grid = document.getElementById('productGrid-' + category);
            const noRes = document.getElementById('noResults-' + category);
            if (grid) grid.innerHTML = filtered.map(p => productCardHTML(p)).join('');
            if (noRes) noRes.style.display = filtered.length === 0 ? 'block' : 'none';
            lucide.createIcons();
        }

        function onSearchPageInput(value) {
            STATE.lastSearchQuery = value;
            const clearBtn = document.getElementById('searchPageClear');
            if (clearBtn) clearBtn.style.display = value ? 'flex' : 'none';

        function clearSearchPage() {
            STATE.lastSearchQuery = '';
            const input = document.getElementById('searchPageInput');
            if (input) input.value = '';
            onSearchPageInput('');
            if (input) input.focus();

        function renderSearchPageResults(query) {
            const container = document.getElementById('searchPageResults');
            if (!container) return;
            const q = String(query || '').trim().toLowerCase();

            if (!q) {
                container.innerHTML = `<div class="search-empty">${lang === 'ar' ? 'ابدأ الكتابة للبحث...' : 'Commencez à taper pour rechercher...'}</div>`;
                return;
            }

            const useArabic = isArabicText(q);
            const activeProducts = products.filter(p => String(p.status).toLowerCase() === 'active');
            const uniqueProducts = getUniqueProducts(activeProducts);

            const typeMatches = new Map();
            for (const ty of types) {
                const s = fuzzyScore(ty.TypeName, q);
                if (s > 0) {
                    const key = String(ty.perfumeId);
                    const prev = typeMatches.get(key);
                    if (!prev || s > prev.score) typeMatches.set(key, {score: s, typeName: ty.TypeName});
                }
            }

            const scored = [];
            for (const p of uniqueProducts) {
                const nameScore = fuzzyScore(p.name, q);
                const nameARScore = fuzzyScore(p.nameAR, q);
                const catScore = fuzzyScore(p.category, q) * 0.4;
                const dupeScore = fuzzyScore(p.dupeOf, q) * 0.7;
                const typeMatch = typeMatches.get(String(p.id));
                const typeScore = typeMatch ? typeMatch.score : 0;
                const primaryScore = useArabic ? nameARScore : nameScore;
                const secondaryScore = useArabic ? nameScore : nameARScore;
                const best = Math.max(primaryScore, secondaryScore * 0.8, catScore, dupeScore, typeScore);
                if (best > 0) scored.push({p, score: best, typeName: typeMatch ? typeMatch.typeName : null});
            }
            scored.sort((a, b) => b.score - a.score);
            const matched = scored.slice(0, 30);

            if (matched.length === 0) {
                container.innerHTML = `<div class="search-empty">${useArabic ? 'لا توجد نتائج' : 'Aucun résultat'}</div>`;
                return;
            }

            const fromPrefix = useArabic ? 'من' : 'À partir de';
            const daLabel = useArabic ? 'د.ج' : 'DA';
            const dupeLabel = useArabic ? 'Dupe من' : 'Dupe de';

            container.innerHTML = matched.map(({p, typeName}) => {
                const img = getProductImage(p, 0);
                const catNorm = String(p.category).trim().toLowerCase();
                const isPerfumeCat = ['extraits', 'parfums de division', 'dupes'].includes(catNorm);
                const displayName = getDisplayNameFor(p, useArabic);
                let priceLabel = '';
                const eff = getEffectivePrice(p);
                if (isFinite(eff) && eff > 0) {
                    priceLabel = `${isPerfumeCat ? fromPrefix + ' ' : ''}${Number(eff).toLocaleString()} ${daLabel}`;
                }
                return `
                <div class="search-result-item" onclick="openSearchResult(${p.id})">
                    <img src="${img}" alt="${p.name}" loading="lazy">
                    <div class="search-result-info">
                        <div class="search-result-name">${displayName}</div>
                        <div class="search-result-meta">
                            <span>${p.category}</span>
                            ${typeName ? `<span>· ${typeName}</span>` : ''}
                            ${p.dupeOf ? `<span>· ${dupeLabel} ${p.dupeOf}</span>` : ''}
                        </div>
                    </div>
                    ${priceLabel ? `<div class="search-result-price">${priceLabel}</div>` : ''}
                </div>`;
            }).join('');
        }

        // ═══════════ PRODUCT DETAIL ═══════════
        function renderProductDetail(productId) {
            const variants = products.filter(pr => pr.id == productId);
            if (variants.length === 0) { navigate('home'); return; }

            const p = variants[0];
            const catNorm = String(p.category).trim().toLowerCase();
            const isExtraits = catNorm === 'extraits';
            const isDivision = catNorm === 'parfums de division';
            const isNewPerfumeCat = catNorm === 'testeurs' || catNorm === 'dupes' || catNorm === 'parfums';
            const isPerfume = isExtraits || isDivision || isNewPerfumeCat;
            const isCollection = catNorm === 'collections';
            const isColorProduct = variants.length > 1 && (catNorm === 'lunettes' || catNorm === 'sacoche' || catNorm === 'portefeuilles');
            const isPortefeuilles = catNorm === 'portefeuilles';
            const isSoins = catNorm === 'soins personnels';

            const activeVolumePrices = isExtraits ? volumePrices : [];
            window.activeVolumePrices = activeVolumePrices;
            window.isDivisionProduct = isDivision;
            window.isNewPerfumeCategory = isNewPerfumeCat;
            window.isCollectionDetail = isCollection;
            window.divisionBasePrice = isDivision ? (Number(p.price) || 0) : null;
            window.divisionBottleVolume = isDivision ? (Number(p.bottleVolume) || 0) : null;
            window.newPerfumeBasePrice = isNewPerfumeCat ? (Number(p.price) || 0) : null;

            let selectedVariant = p;
            window.selectedColorVariant = selectedVariant;

            const pageEl = document.getElementById('page-product-detail');
            const isLiked = STATE.wishlist.includes(p.id);
            const stockClass = p.stock > 10 ? 'stock-in' : p.stock > 0 ? 'stock-low' : 'stock-out';
            const stockText = p.stock > 10 ? t('inStock') : p.stock > 0 ? `${t('onlyLeft')} ${p.stock}` : t('soldOut');
            const mainImgSrc = getProductImage(selectedVariant, 0);
            let volumeSelectorHTML = '', typeSelectorHTML = '', colorSelectorHTML = '';
            let infoSectionHTML = '', fullBottleHTML = '';
            let touchStartX = 0, touchEndX = 0;

            // Collection-specific
            const bottleIdsRaw = isCollection ? String(p.bottleIds || '').split(',').map(s => s.trim()).filter(Boolean) : [];
            const bottleProducts = bottleIdsRaw
                .map(id => products.find(pr => String(pr.id) === String(id) && String(pr.status).toLowerCase() === 'active'))

        window.selectColorVariant = function (color, productId) {
            const allBoxes = document.querySelectorAll('#colorGrid .type-box');

            const variant = products.find(pr => pr.id == productId && pr.color === color);
            if (!variant) return;
            window.selectedColorVariant = variant;
            const mainImg = document.getElementById('mainProductImage');
            if (mainImg) mainImg.src = getProductImage(variant, 0);
            const thumbs = document.querySelectorAll('.thumb-img');
            thumbs.forEach((thumb, i) => {
                const newSrc = getProductImage(variant, i);
                thumb.src = newSrc;
                thumb.setAttribute('onclick', `changeMainImage(this, '${newSrc}')`);
                thumb.style.border = i === 0 ? '2px solid var(--accent)' : '2px solid transparent';

                const orig = variant.discountPrice

        function changeMainImage(thumbnailElement, newSrc) {
            const container = thumbnailElement.closest('.product-detail-gallery');

            const mainImg = container.querySelector('#mainProductImage');
            if (mainImg) mainImg.src = newSrc;
            const allThumbs = container.querySelectorAll('.thumb-img');
            allThumbs.forEach(t => t.style.border = '2px solid transparent');
            thumbnailElement.style.border = '2px solid var(--accent)';
