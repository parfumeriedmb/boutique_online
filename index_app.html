        function selectType(chip, typeName, multiplier) {
            const allChips = document.querySelectorAll('#typesGrid .type-box');
            allChips.forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            window.selectedType = typeName;
            window.currentMultiplier = Number(multiplier);
            updatePerfumePrice();
        }

        function updatePerfumePrice() {
            const multiplier = window.currentMultiplier || 1;
            let total;
            if (window.isNewPerfumeCategory) {
                total = window.newPerfumeBasePrice * multiplier;
            } else {
                const select = document.getElementById('volumeSelect');
                if (!select) return;
                let basePrice;
                if (window.isDivisionProduct) {
                    const ml = parseInt(select.value) || 10;
                    basePrice = window.divisionBasePrice * (ml / 10);
                } else {
                    const activeVolumePrices = window.activeVolumePrices || volumePrices;
                    const selected = activeVolumePrices.find(vp => vp.volume === select.value);
                    if (!selected) return;
                    basePrice = selected.price;
                }
                total = basePrice * multiplier;
                window.selectedVolume = select.value;
            }
            window.currentPerfumeBasePrice = total;
            const priceDisplay = document.getElementById('perfumePriceDisplay');
            if (priceDisplay) priceDisplay.textContent = `${Number(total).toLocaleString()} ${t('da')}`;
        }

        function changeDetailQty(delta) {
            const el = document.getElementById('detailQty');
            if (!el) return;
            let v = parseInt(el.textContent) + delta;
            const maxQty = window.detailMaxQty || 20;
            if (v < 1) v = 1;
            if (v > maxQty) v = maxQty;
            el.textContent = v;
        }

        function toggleBottleSelection(productId) {
            if (!window.selectedBottleIds) window.selectedBottleIds = new Set();
            const idStr = String(productId);
            if (window.selectedBottleIds.has(idStr)) window.selectedBottleIds.delete(idStr);
            else window.selectedBottleIds.add(idStr);
            document.querySelectorAll('.bottle-card').forEach(card => {
                const id = card.getAttribute('data-bottle-id');
                card.classList.toggle('selected', window.selectedBottleIds.has(id));
            });
            updateCollectionPrice();
        }

        function toggleSelectAllBottles() {
            if (!window.collectionBottleProducts) return;
            if (!window.selectedBottleIds) window.selectedBottleIds = new Set();
            const allIds = window.collectionBottleProducts.map(b => String(b.id));
            const allSelected = allIds.every(id => window.selectedBottleIds.has(id));
            window.selectedBottleIds = allSelected ? new Set() : new Set(allIds);
            document.querySelectorAll('.bottle-card').forEach(card => {
                const id = card.getAttribute('data-bottle-id');
                card.classList.toggle('selected', window.selectedBottleIds.has(id));
            });
            updateCollectionPrice();
        }

        function updateCollectionPrice() {
            const priceVal = document.getElementById('collectionPriceValue');
            const priceOrig = document.getElementById('collectionPriceOriginal');
            const savingsEl = document.getElementById('collectionSavings');
            const runningEl = document.getElementById('collectionRunningTotal');
            if (!priceVal) return;
            const selectedCount = window.selectedBottleIds ? window.selectedBottleIds.size : 0;
            const totalBottles = (window.collectionBottleProducts || []).length;
            const per = window.collectionPerBottle || 0;
            const full = window.collectionFullPrice || 0;

            if (runningEl) {
                runningEl.textContent = totalBottles ? `${selectedCount} / ${totalBottles} ${t('bottlesUnit')}` : '';
            }

            if (selectedCount === 0) {
                priceVal.textContent = `${per.toLocaleString()} ${t('da')}`;
                if (priceOrig) priceOrig.style.display = 'none';
                if (savingsEl) { savingsEl.textContent = t('selectBottles'); savingsEl.style.color = 'var(--text-light)'; }
                return;
            }

            if (totalBottles > 0 && selectedCount === totalBottles) {
                const totalSeparate = totalBottles * per;
                priceVal.textContent = `${full.toLocaleString()} ${t('da')}`;
                if (totalSeparate > full) {
                    priceOrig.textContent = `${totalSeparate.toLocaleString()} ${t('da')}`;
                    priceOrig.style.display = 'inline';
                } else {
                    priceOrig.style.display = 'none';
                }
                if (savingsEl) {
                    const save = totalSeparate - full;
                    savingsEl.textContent = save > 0 ? `${t('youSave')} ${save.toLocaleString()} ${t('da')}` : '';
                    savingsEl.style.color = 'var(--success)';
                }
            } else {
                priceVal.textContent = `${(selectedCount * per).toLocaleString()} ${t('da')}`;
                if (priceOrig) priceOrig.style.display = 'none';
                if (savingsEl) { savingsEl.textContent = t('pricePerBottle'); savingsEl.style.color = 'var(--text-light)'; }
            }
        }

        // ═══════════ ADD TO CART ═══════════
        function addToCartFromDetail(productId, isPerfume) {
            const p = window.selectedColorVariant || products.find(pr => pr.id == productId);
            if (!p) { showToast(t('soldOut')); return; }

            const catNorm = String(p.category).trim().toLowerCase();

            if (catNorm === 'collections') {
                const selected = window.selectedBottleIds ? Array.from(window.selectedBottleIds) : [];
                if (selected.length === 0) {
                    showToast(lang === 'ar' ? 'يرجى اختيار قارورة واحدة على الأقل' : 'Veuillez sélectionner au moins un flacon');
                    return;
                }
                const totalBottles = (window.collectionBottleProducts || []).length;
                const per = Number(p.pricePerBottle) || 0;
                const full = Number(p.collectionPrice) || 0;
                const isFullSet = selected.length === totalBottles && totalBottles > 0;
                const unitPrice = isFullSet ? full : selected.length * per;

                const bottleNames = selected.map(id => {
                    const bp = products.find(pr => String(pr.id) === String(id));
                    return bp ? getDisplayName(bp) : '';
                }).filter(Boolean).join(', ');

                const unitAr = selected.length === 1 ? 'قارورة' : 'قوارير';
                const unitFr = selected.length === 1 ? 'flacon' : 'flacons';

                const itemName = isFullSet
                    ? `${p.name} - ${t('collectionPrice')} (${totalBottles} ${unitFr})`
                    : `${p.name} - ${selected.length} ${unitFr}`;
                const itemNameAR = isFullSet
                    ? `${p.nameAR || p.name} - ${t('collectionPrice')} (${totalBottles} ${unitAr})`
                    : `${p.nameAR || p.name} - ${selected.length} ${unitAr}`;

                const customProduct = {
                    id: productId + '_col_' + selected.sort().join('-'),
                    name: itemName,
                    nameAR: itemNameAR,
                    price: unitPrice,
                    image: getProductImage(p, 0),
                    category: p.category,
                    stock: p.stock,
                    originalProductId: productId,
                    bottlesQty: selected.length,
                    bottlesIds: selected,
                    bottlesNames: bottleNames
                };
                addToCart(customProduct, 1, true);
                return;
            }

            const qtyEl = document.getElementById('detailQty');
            const qty = qtyEl ? (parseInt(qtyEl.textContent) || 1) : 1;

            if (isPerfume) {
                const isDivision = p.category === 'Parfums de division';
                const isExtraits = p.category === 'Extraits';
                const requiresVolume = isDivision || isExtraits;
                if (requiresVolume && !window.selectedVolume) { showToast(t('chooseVolume')); return; }
                const price = window.currentPerfumeBasePrice;
                const volume = window.selectedVolume || '';
                const typeName = window.selectedType || '';
                const nameParts = [p.name];
                if (volume) nameParts.push(volume);
                if (typeName) nameParts.push(typeName);
                const name = nameParts.join(' - ');
                const nameARParts = [];
                if (p.nameAR) nameARParts.push(p.nameAR);
                if (volume) nameARParts.push(volume);
                if (typeName) nameARParts.push(typeName);
                const nameAR = nameARParts.join(' - ');
                const customProduct = {
                    id: productId + '_' + (volume ? encodeURIComponent(volume) : '') + '_' + (typeName ? encodeURIComponent(typeName) : ''),
                    name, nameAR, price, volume, type: typeName,
                    image: getProductImage(p, 0), category: p.category, stock: p.stock, originalProductId: productId
                };
                addToCart(customProduct, qty, true);
                return;
            }

            const color = p.color || '';
            const customId = productId + (color ? '_' + encodeURIComponent(color) : '');
            const name = color ? `${p.name} - ${color}` : p.name;
            const nameAR = color ? `${p.nameAR ? p.nameAR : p.name} - ${color}` : (p.nameAR || p.name);
            const price = p.discountPrice || p.price;
            const customProduct = {
                id: customId, name, nameAR, price,
                image: getProductImage(p, 0), category: p.category, stock: p.stock,
                originalProductId: productId, color
            };
            addToCart(customProduct, qty, true);
        }

        function addFullBottleToCart(productId) {
            const p = window.selectedColorVariant || products.find(pr => pr.id == productId);
            if (!p) { showToast(t('soldOut')); return; }
            const price = Number(p.prixBouteilleComplete) || 0;
            if (price <= 0) { showToast('No full bottle price set'); return; }
            const bv = Number(p.bottleVolume) || 0;
            const bvLabel = bv > 0 ? ` - ${bv}ml` : '';
            const baseNameAR = p.nameAR || p.name;
            const customProduct = {
                id: productId + '_fullbottle',
                name: `${p.name} - ${t('fullBottle')}${bvLabel}`,
                nameAR: `${baseNameAR} - ${lang === 'ar' ? 'القارورة كاملة' : t('fullBottle')}${bvLabel}`,
                price, image: getProductImage(p, 0), category: p.category,
                stock: p.stock, originalProductId: productId, bottleVolume: bv, type: 'full bottle'
            };
            addToCart(customProduct, 1, true);
        }

        function addToCart(productIdOrCustomObj, qtyOrUndefined, isCustom = false) {
            if (isCustom) {
                const customProduct = productIdOrCustomObj;
                const qty = qtyOrUndefined || 1;
                STATE.cart.push({ productId: customProduct.id, customProduct, qty });
                saveState(); updateCartBadge(); renderCartDrawer();
                showToast(`"${customProduct.name}" ${t('addToCart')}`);
                return;
            }
            const productId = productIdOrCustomObj;
            const qty = qtyOrUndefined || 1;
            const p = products.find(pr => pr.id == productId);
            if (!p || p.stock <= 0) { showToast(t('soldOut')); return; }
            const existing = STATE.cart.find(c => c.productId == productId && !c.customProduct);
            if (existing) { existing.qty = Math.min(existing.qty + qty, p.stock); }
            else { STATE.cart.push({ productId, qty: Math.min(qty, p.stock) }); }
            saveState(); updateCartBadge(); renderCartDrawer();
            showToast(`"${p.name}" ${t('addToCart')}`);
        }

        function removeFromCart(pid) {
            STATE.cart = STATE.cart.filter(c => c.productId != pid);
            saveState(); updateCartBadge(); renderCartDrawer();
        }

        function updateCartQty(pid, delta) {
            const item = STATE.cart.find(c => c.productId == pid);
            if (!item) return;
            if (item.customProduct) {
                item.qty += delta;
                if (item.qty < 1) { removeFromCart(pid); return; }
            } else {
                const p = products.find(pr => pr.id == pid);
                item.qty += delta;
                if (item.qty < 1) { removeFromCart(pid); return; }
                if (p && item.qty > p.stock) item.qty = p.stock;
            }
            saveState(); updateCartBadge(); renderCartDrawer();
        }

        function getCartSubtotal() {
            return STATE.cart.reduce((sum, item) => {
                if (item.customProduct) return sum + (item.customProduct.price * item.qty);
                const p = products.find(pr => pr.id == item.productId);
                return sum + (p ? (Number(p.discountPrice) || Number(p.price)) * item.qty : 0);
            }, 0);
        }
        function getCartTotal() { return getCartSubtotal(); }
        function getCartCount() { return STATE.cart.reduce((s, i) => s + i.qty, 0); }

        function updateCartBadge() {
            const c = getCartCount();
            const mb = document.getElementById('cartBadgeMobile');
            if (mb) { mb.textContent = c; mb.style.display = c > 0 ? 'flex' : 'none'; }
        }

        function toggleCart() {
            const ov = document.getElementById('cartOverlay');
            const dr = document.getElementById('cartDrawer');
            if (dr.classList.contains('open')) {
                ov.classList.remove('open'); dr.classList.remove('open');
                document.body.style.overflow = '';
            } else {
                const sDr = document.getElementById('settingsDrawer');
                const sOv = document.getElementById('settingsOverlay');
                if (sDr?.classList.contains('open')) {
                    sDr.classList.remove('open');
                    sOv?.classList.remove('open');
                }
                renderCartDrawer();
                ov.classList.add('open'); dr.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }

        function renderCartDrawer() {
            const itemsEl = document.getElementById('cartItems');
            document.getElementById('cartItemCount').textContent = `(${getCartCount()})`;
            document.getElementById('cartTotal').textContent = `${getCartTotal().toLocaleString()} ${t('da')}`;
            if (STATE.cart.length === 0) {
                itemsEl.innerHTML = `<div class="cart-empty"><i data-lucide="shopping-cart" style="width:28px;height:28px;"></i><br>${t('cartEmpty')}</div>`;
                document.getElementById('cartFooter').style.display = 'none';
            } else {
                document.getElementById('cartFooter').style.display = 'flex';
                itemsEl.innerHTML = STATE.cart.map(item => {
                    if (item.customProduct) {
                        const p = item.customProduct;
                        const displayName = (lang === 'ar' && p.nameAR) ? p.nameAR : p.name;
                        const bottlesLine = p.bottlesNames
                            ? `<div style="font-size:0.72rem;color:var(--text-light);margin-top:2px;white-space:normal;">${p.bottlesNames}</div>` : '';
                        return `
                        <div class="cart-item">
                          <div class="ci-img"><img src="${p.image}" alt="${p.name}"></div>
                          <div class="ci-info">
                            <div class="ci-name">${displayName}</div>
                            ${bottlesLine}
                            <div class="ci-price">${Number(p.price).toLocaleString()} ${t('da')} × ${item.qty}</div>
                            <div class="ci-qty">
                              <button onclick="updateCartQty('${p.id}',-1)">−</button>
                              <span>${item.qty}</span>
                              <button onclick="updateCartQty('${p.id}',1)">+</button>
                            </div>
                          </div>
                          <button class="ci-remove" onclick="removeFromCart('${p.id}')"><i data-lucide="trash-2"></i></button>
                        </div>`;
                    }
                    const p = products.find(pr => pr.id == item.productId);
                    if (!p) return '';
                    const dp = p.discountPrice || p.price;
                    return `
                    <div class="cart-item">
                      <div class="ci-img"><img src="${getProductImage(p)}" alt="${p.name}"></div>
                      <div class="ci-info">
                        <div class="ci-name">${getDisplayName(p)}</div>
                        <div class="ci-price">${Number(dp).toLocaleString()} ${t('da')} × ${item.qty}</div>
                        <div class="ci-qty">
                          <button onclick="updateCartQty(${item.productId},-1)">−</button>
                          <span>${item.qty}</span>
                          <button onclick="updateCartQty(${item.productId},1)">+</button>
                        </div>
                      </div>
                      <button class="ci-remove" onclick="removeFromCart(${item.productId})"><i data-lucide="trash-2"></i></button>
                    </div>`;
                }).join('');
            }
            lucide.createIcons();
        }

        function selectDelivery(method) {
            document.querySelectorAll('#deliveryMethodGroup .radio-option').forEach(el => el.classList.remove('selected'));
            const opt = document.querySelector(`.radio-option:has(input[value="${method}"])`);
            if (opt) opt.classList.add('selected');
            document.querySelector(`input[name="delivery"][value="${method}"]`).checked = true;
            const addr = document.getElementById('addressSection'), br = document.getElementById('branchSection');
            if (method === 'pickup') {
                addr.classList.add('disabled'); br.style.display = 'block';
                ['custAddress', 'custWilaya', 'custCity'].forEach(id => document.getElementById(id)?.removeAttribute('required'));
            } else {
                addr.classList.remove('disabled'); br.style.display = 'none';
                ['custAddress', 'custWilaya', 'custCity'].forEach(id => document.getElementById(id)?.setAttribute('required', ''));
            }
        }

        async function submitOrderToSheet(order) {
            try {
                const formData = new FormData();
                formData.append('id', order.id);
                formData.append('createdAt', order.createdAt);
                formData.append('time', new Date().toLocaleTimeString('en-US', {hour12: false}));
                formData.append('fullName', order.fullName);
                formData.append('phone', order.phone);
                formData.append('wilaya', order.wilaya);
                formData.append('city', order.city);
                formData.append('deliveryAddress', order.deliveryAddress || '');
                formData.append('deliveryMethod', order.deliveryMethod);
                formData.append('paymentMethod', order.paymentMethod);
                formData.append('branchId', order.branchId || '');
                formData.append('products', JSON.stringify(order.products));
                formData.append('subtotal', order.subtotal);
                formData.append('total', order.total);
                formData.append('status', order.status);
                formData.append('notes', order.notes || '');
                await fetch(ORDER_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: formData });
            } catch (error) { console.error('Order submission failed:', error); }
        }

        function submitOrder(event) {
            event.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const delivery = document.querySelector('input[name="delivery"]:checked')?.value || 'cod';
            const address = delivery === 'cod' ? document.getElementById('custAddress').value.trim() : null;
            const wilaya = delivery === 'cod' ? document.getElementById('custWilaya').value.trim() : null;
            const city = delivery === 'cod' ? document.getElementById('custCity').value.trim() : null;
            const branchId = delivery === 'pickup' ? parseInt(document.getElementById('pickupBranch').value) : null;
            if (!name || !phone) { showToast(t('fillRequired')); return; }
            if (delivery === 'cod' && (!address || !wilaya || !city)) { showToast(t('fillAddress')); return; }
            if (delivery === 'pickup' && !branchId) { showToast(t('selectBranch')); return; }

            const orderProducts = STATE.cart.map(item => {
                if (item.customProduct) {
                    const cp = item.customProduct;
                    const fullName = cp.bottlesNames ? `${cp.name} — ${cp.bottlesNames}` : cp.name;
                    return {
                        productId: cp.originalProductId,
                        name: fullName,
                        qty: item.qty,
                        price: cp.price,
                        volume: cp.volume || '',
                        type: cp.type || '',
                        bottles: cp.bottlesNames || '',
                        bottlesQty: cp.bottlesQty || '',
                        bottlesIds: cp.bottlesIds || []
                    };
                }
                const p = products.find(pr => pr.id == item.productId);
                return { productId: item.productId, name: p?.name, qty: item.qty, price: p?.discountPrice || p?.price };
            });

            const order = {
                id: Date.now(), fullName: name, phone, wilaya: delivery === 'cod' ? wilaya : '',
                city: delivery === 'cod' ? city : '', deliveryAddress: delivery === 'cod' ? address : '',
                products: orderProducts, subtotal: getCartSubtotal(), total: getCartTotal(),
                paymentMethod: 'cod', deliveryMethod: delivery, branchId, status: 'pending',
                notes: document.getElementById('orderNotes')?.value || '', createdAt: new Date().toISOString(),
            };

            STATE.orders.push(order);
            STATE.customers.push({id: Date.now(), fullName: name, phone, email: '', createdAt: new Date().toISOString()});
            STATE.cart.forEach(c => {
                if (!c.customProduct) {
                    const p = products.find(pr => pr.id == c.productId);
                    if (p) p.stock = Math.max(0, p.stock - c.qty);
                }
            });
            STATE.cart = [];
            saveState();
            submitOrderToSheet(order);
            updateCartBadge(); renderCartDrawer();
            localStorage.setItem('dmb_last_order_id', order.id);
            navigate('confirmation');
            showToast(t('orderConfirmed'));
        }

                <div class="section-header"><h2><i data-lucide="info" class="icon-inline"></i> ${t('aboutUs')}</h2></div>

                    <p style="font-size:0.92rem;">${t('aboutContent')}</p>
                </div>

                <div class="section-header"><h2>${t('ourStores')}</h2></div>
                <div class="branches-grid">
                    ${activeBranches.map(b => {
                        const content = `
                            <i data-lucide="map-pin" class="branch-icon icon-lg"></i>
                            <h4>${b.name}</h4>
                            <p>${b.address || ''}</p>
                            <p style="font-size:0.7rem;color:var(--text-light);">${b.workHours || ''}</p>
                        `;
                        if (b.map && b.map.trim()) {
                            return `<a href="" target="" rel="noopener" style="text-decoration:none;color:inherit;display:block;"><div class="branch-card">${content}</div></a>`;
                        }
                        return `<div class="branch-card">${content}</div>`;
                    }).join('') || `<p style="color:var(--text-light);font-size:0.85rem;">${lang === 'ar' ? 'لا توجد فروع' : 'Aucune boutique'}</p>`}
                </div>
            `;
            lucide.createIcons();
        }

        function renderPrivacy() {
            const pageEl = document.getElementById('page-privacy');
            pageEl.innerHTML = `
                <div class="section-header"><h2><i data-lucide="shield" class="icon-inline"></i> ${t('privacyPolicy')}</h2></div>
                <div style="padding:0 4px;line-height:1.8;color:var(--text-secondary);margin-bottom:30px;">
                    <p style="font-size:0.92rem;">${t('privacyContent')}</p>
                </div>`;
            lucide.createIcons();
        }

        // ═══════════ SETTINGS DRAWER ═══════════
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0d0d' : '#ffffff');
        }

        function setTheme(theme) {
            try { localStorage.setItem('dmb_theme', theme); } catch (e) { }
            applyTheme(theme);
            updateSettingsActiveStates();
        }

        function toggleSettingsDrawer() {
            const ov = document.getElementById('settingsOverlay');
            const dr = document.getElementById('settingsDrawer');
            if (!ov || !dr) return;
            if (dr.classList.contains('open')) {
                ov.classList.remove('open'); dr.classList.remove('open');
                document.body.style.overflow = '';
            } else {
                const cartDr = document.getElementById('cartDrawer');
                const cartOv = document.getElementById('cartOverlay');
                if (cartDr?.classList.contains('open')) {
                    cartDr.classList.remove('open');
                    cartOv?.classList.remove('open');
                }
                ov.classList.add('open'); dr.classList.add('open');
                document.body.style.overflow = 'hidden';
                updateSettingsActiveStates();
                lucide.createIcons();
            }
        }

        function updateSettingsActiveStates() {
            const arBtn = document.getElementById('langArBtn');
            const frBtn = document.getElementById('langFrBtn');
            if (arBtn) arBtn.classList.toggle('active', lang === 'ar');
            if (frBtn) frBtn.classList.toggle('active', lang === 'fr');
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            const lightBtn = document.getElementById('themeLightBtn');
            const darkBtn = document.getElementById('themeDarkBtn');
            if (lightBtn) lightBtn.classList.toggle('active', theme === 'light');
            if (darkBtn) darkBtn.classList.toggle('active', theme === 'dark');
        }

        // ═══════════ UTILS ═══════════
        function init() {
            updateCartBadge();
            renderCartDrawer();
            updateSettingsActiveStates();
            window.addEventListener('scroll', handleHomeScroll, { passive: true });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('cartDrawer').classList.contains('open')) toggleCart();
                    if (document.getElementById('settingsDrawer')?.classList.contains('open')) toggleSettingsDrawer();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadData);

        window.addEventListener('hashchange', () => {
            if (navigatingManually) { navigatingManually = false; return; }
            const hash = decodeURIComponent(window.location.hash.replace('#', ''));
            const [page, query] = hash.split('?');
            const params = new URLSearchParams(query || '');
            navigate(page, params.get('id') ? parseInt(params.get('id')) : null);
        });

        init();
    </script>
</body>

</html>
